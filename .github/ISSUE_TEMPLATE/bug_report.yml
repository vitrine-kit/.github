name: Bug report
description: Report a bug in Vitrine Kit
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. First, please check that this bug isn't already filed.
  - type: input
    id: area
    attributes:
      label: Package / area
      placeholder: "@vitrine-kit/core, CLI, registry/cart, backend-payload template…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "e.g. @vitrine-kit/core@0.1.0, vitrine CLI 0.1.2"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Node, pnpm, backend (payload/vendure)"
